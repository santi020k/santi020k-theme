name: Bug report
description: Report a rendering, contrast, packaging, or website issue.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - VS Code extension / themes
        - Zed theme
        - Chrome theme
        - Codex theme
        - Terminal themes / CLI
        - Raycast theme
        - Slack theme
        - JetBrains / Android Studio theme
        - Xcode theme
        - Shared npm tokens / helpers
        - Theme colors
        - Syntax highlighting
        - Semantic highlighting
        - Website
        - Marketplace / Open VSX package
        - Release automation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or extension version
      description: Include the installed version and installation source.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include exact steps, expected behavior, and actual behavior. For website problems, add the page URL and browser version.
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Theme variant
      placeholder: "santi020k dark, santi020k light, or santi020k hc dark"
  - type: input
    id: editor
    attributes:
      label: Tool, operating system, and version
      placeholder: "VS Code 1.xx, Cursor, Windsurf, VSCodium..."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or sample code
      description: Add screenshots, language snippets, or file types that show the issue. Remove credentials, private code, and personal information.

  - type: checkboxes
    id: existing_reports
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true
