name: CI

on:
  pull_request:
    branches: [main, "release/v*"]
    # Title and label edits are handled by pr-metadata.yml without repeating this workflow.
    types: [opened, synchronize, reopened]
  push:
    # Release branches are validated through their pull requests.
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Quality v2 shadow plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      appearance: ${{ steps.scope.outputs.appearance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether native appearance validation is required
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs
      - name: Install pinned Quality
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh -o "$RUNNER_TEMP/install-quality.sh"
          sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality "v$(cat .quality-version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test policy and deployment failure handling
        run: node --test scripts/quality-impact.node-test.mjs
      - name: Record conservative committed-source plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          args=(--full)
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$BASE" && "$BRANCH" != release/* && "$BRANCH" != changeset-release/* ]]; then
            args=(--base "$BASE" --head HEAD --comparison merge-base)
          fi
          quality impact plan "${args[@]}" --format json >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      # Reads the live title and labels, so re-running this job after an edit uses current values.
      - name: Validate pull request title and changeset
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-pr-metadata.sh

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Install native Neovim test runtime
        run: |
          curl --fail --location --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz --output "$RUNNER_TEMP/neovim.tar.gz"
          printf '%s  %s\n' '474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87' "$RUNNER_TEMP/neovim.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          REQUIRE_NATIVE_NEOVIM: '1'
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: pnpm run ci:check

  dependency-audit:
    # Advisory here; dependency-audit.yml fails on the same check every day.
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit workspace dependencies
        run: pnpm run audit:dependencies

  appearance-wallpapers:
    name: Native macOS wallpaper validation
    needs: impact
    # Skipped only when the plan positively reports that no wallpaper input changed.
    if: needs.impact.outputs.appearance != 'false'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Validate appearance frames and source fingerprints
        run: node scripts/build-appearance-wallpapers.mjs --check

  gate:
    name: Required checks
    if: always()
    needs: [validate, impact, appearance-wallpapers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation boundary
        env:
          VALIDATION: ${{ needs.validate.result }}
          IMPACT: ${{ needs.impact.result }}
          APPEARANCE: ${{ needs.appearance-wallpapers.result }}
          APPEARANCE_REQUIRED: ${{ needs.impact.outputs.appearance }}
        run: |
          for result in "$VALIDATION" "$IMPACT"; do
            [[ "$result" == success ]] || exit 1
          done
          if [[ "$APPEARANCE_REQUIRED" == false ]]; then
            [[ "$APPEARANCE" == success || "$APPEARANCE" == skipped ]] || exit 1
          else
            [[ "$APPEARANCE" == success ]] || exit 1
          fi
