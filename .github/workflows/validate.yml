name: CI

on:
  pull_request:
    branches: [main, "release/v*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main, "release/v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit workspace dependencies
        run: pnpm run audit:dependencies

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitprompt validate --input -

      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Install native Neovim test runtime
        run: |
          curl --fail --location --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz --output "$RUNNER_TEMP/neovim.tar.gz"
          printf '%s  %s\n' '474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87' "$RUNNER_TEMP/neovim.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          REQUIRE_NATIVE_NEOVIM: '1'
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: pnpm run ci:check

  appearance-wallpapers:
    name: Native macOS wallpaper validation
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Validate appearance frames and source fingerprints
        run: node scripts/build-appearance-wallpapers.mjs --check
