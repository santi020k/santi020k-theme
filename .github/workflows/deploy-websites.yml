name: Deploy Websites

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-websites.yml"
      - "apps/**"
      - "packages/theme/**"
      - "packages/theme-core/**"
      - "packages/santi020k-codex-theme/**"
      - "packages/santi020k-terminal-theme/**"
      - "packages/santi020k-zed-theme/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      site:
        description: Website to deploy.
        default: all
        options: [all, theme, vscode, chrome, codex, terminal, zed]
        type: choice

permissions:
  contents: read

concurrency:
  group: deploy-websites
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy selected websites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: websites-production
      url: https://theme.santi020k.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT_CHROME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_CHROME }}
      PROJECT_CODEX: ${{ vars.CLOUDFLARE_PAGES_PROJECT_CODEX }}
      PROJECT_TERMINAL: ${{ vars.CLOUDFLARE_PAGES_PROJECT_TERMINAL }}
      PROJECT_THEME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}
      PROJECT_VSCODE: ${{ vars.CLOUDFLARE_PAGES_PROJECT_VSCODE }}
      PROJECT_ZED: ${{ vars.CLOUDFLARE_PAGES_PROJECT_ZED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 2

      - name: Select deployment targets
        id: targets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_SITE: ${{ inputs.site }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_SITE" == "all" ]]; then
              sites="theme vscode chrome codex terminal zed"
            else
              sites="$REQUESTED_SITE"
            fi
            echo "sites=$sites" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE_SHA="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/changed-files"

          global_pattern='^(\.github/workflows/deploy-websites\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|packages/theme/|packages/theme-core/)'
          if grep -Eq "$global_pattern" "$RUNNER_TEMP/changed-files"; then
            sites="theme vscode chrome codex terminal zed"
          else
            sites=""
            grep -Eq '^apps/website/' "$RUNNER_TEMP/changed-files" && sites+=" theme"
            grep -Eq '^apps/vscode-website/' "$RUNNER_TEMP/changed-files" && sites+=" vscode"
            grep -Eq '^apps/chrome-website/' "$RUNNER_TEMP/changed-files" && sites+=" chrome"
            grep -Eq '^(apps/codex-website/|packages/santi020k-codex-theme/)' "$RUNNER_TEMP/changed-files" && sites+=" codex"
            grep -Eq '^(apps/terminal-website/|packages/santi020k-terminal-theme/)' "$RUNNER_TEMP/changed-files" && sites+=" terminal"
            grep -Eq '^(apps/zed-website/|packages/santi020k-zed-theme/)' "$RUNNER_TEMP/changed-files" && sites+=" zed"
            sites="${sites# }"
          fi
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.targets.outputs.sites != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        if: steps.targets.outputs.sites != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.targets.outputs.sites != ''
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        if: steps.targets.outputs.sites != ''
        env:
          SITES: ${{ steps.targets.outputs.sites }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          for site in $SITES; do
            case "$site" in
              theme) project="$PROJECT_THEME" ;;
              vscode) project="$PROJECT_VSCODE" ;;
              chrome) project="$PROJECT_CHROME" ;;
              codex) project="$PROJECT_CODEX" ;;
              terminal) project="$PROJECT_TERMINAL" ;;
              zed) project="$PROJECT_ZED" ;;
              *) echo "Unknown deployment target: $site"; exit 1 ;;
            esac
            test -n "$project" || { echo "Missing Cloudflare project for $site"; exit 1; }
          done

      - name: Build and deploy websites
        if: steps.targets.outputs.sites != ''
        env:
          SITES: ${{ steps.targets.outputs.sites }}
        run: |
          for site in $SITES; do
            case "$site" in
              theme) build="site:build"; output="apps/website/dist"; project="$PROJECT_THEME" ;;
              vscode) build="site:vscode:build"; output="apps/vscode-website/dist"; project="$PROJECT_VSCODE" ;;
              chrome) build="site:chrome:build"; output="apps/chrome-website/dist"; project="$PROJECT_CHROME" ;;
              codex) build="site:codex:build"; output="apps/codex-website/dist"; project="$PROJECT_CODEX" ;;
              terminal) build="site:terminal:build"; output="apps/terminal-website/dist"; project="$PROJECT_TERMINAL" ;;
              zed) build="site:zed:build"; output="apps/zed-website/dist"; project="$PROJECT_ZED" ;;
            esac
            pnpm run "$build"
            pnpm exec wrangler pages deploy "$output" \
              --project-name="$project" \
              --branch=main \
              --commit-hash="$GITHUB_SHA"
          done
