name: Deploy Theme Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-websites.yml"
      - "apps/website/**"
      - "apps/vscode-website/**"
      - "apps/chrome-website/**"
      - "apps/codex-website/**"
      - "apps/terminal-website/**"
      - "apps/zed-website/**"
      - "packages/santi020k-codex-theme/**"
      - "packages/santi020k-terminal-theme/**"
      - "packages/santi020k-zed-theme/**"
      - "packages/santi020k-raycast-theme/**"
      - "packages/santi020k-slack-theme/**"
      - "packages/santi020k-jetbrains-theme/**"
      - "packages/santi020k-xcode-theme/**"
      - "packages/theme/**"
      - "packages/theme-core/**"
      - "scripts/sync-consolidated-site-assets.mjs"
      - "cloudflare/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-theme-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy theme.santi020k.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Cloudflare deployment config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$PROJECT_NAME" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_THEME_HUB repository variable"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build consolidated website
        run: pnpm run site:build

      - name: Deploy consolidated website to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy apps/website/dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}" --branch=main

      - name: Preserve legacy domain redirects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for project in \
            santi020k-vscode-theme \
            santi020k-chrome-theme \
            santi020k-terminal-theme \
            santi020k-zed-theme \
            santi020k-codex-theme
          do
            pnpm exec wrangler pages deploy "cloudflare/legacy-pages/$project" --project-name="$project" --branch=main
          done
