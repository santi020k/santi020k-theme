name: Deploy Theme Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-websites.yml"
      - "apps/website/**"
      - "apps/vscode-website/**"
      - "apps/chrome-website/**"
      - "apps/codex-website/**"
      - "apps/terminal-website/**"
      - "apps/zed-website/**"
      - "artwork/**"
      - "packages/santi020k-chrome-theme/**"
      - "packages/santi020k-codex-theme/**"
      - "packages/santi020k-terminal-theme/**"
      - "packages/santi020k-zed-theme/**"
      - "packages/santi020k-raycast-theme/**"
      - "packages/santi020k-slack-theme/**"
      - "packages/santi020k-jetbrains-theme/**"
      - "packages/santi020k-xcode-theme/**"
      - "packages/santi020k-obsidian-theme/**"
      - "packages/santi020k-neovim-theme/**"
      - "packages/santi020k-theme/src/tokens/vscode/base-themes/**"
      - "packages/santi020k-theme/scripts/validate-themes.mjs"
      - "scripts/build-theme-downloads.mjs"
      - "scripts/deploy-legacy-pages.sh"
      - "scripts/generate-wallpaper-downloads.mjs"
      - "scripts/generate-banner-downloads.mjs"
      - "scripts/lib/port-palette.mjs"
      - "scripts/lib/color-contrast.mjs"
      - "docs/iphone-setup.md"
      - "packages/theme/**"
      - "packages/theme-core/**"
      - "scripts/sync-consolidated-site-assets.mjs"
      - "cloudflare/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "LICENSE"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-theme-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy theme.santi020k.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: websites-production
      url: https://theme.santi020k.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Cloudflare deployment config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$PROJECT_NAME" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_THEME_HUB repository variable"; exit 1; }

      - name: Build consolidated website
        run: pnpm run site:build

      - name: Validate website SEO and links
        run: pnpm run validate:seo && pnpm run validate:links

      - name: Deploy consolidated website to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy apps/website/dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}" --branch=main

      - name: Preserve legacy domain redirects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/deploy-legacy-pages.sh
