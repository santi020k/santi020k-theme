name: Deploy Theme Website

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-theme-website-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  manual-validation:
    name: Validate manual website deployment
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit workspace dependencies
        run: pnpm run audit:dependencies

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Install native Neovim test runtime
        run: |
          curl --fail --location --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz --output "$RUNNER_TEMP/neovim.tar.gz"
          printf '%s  %s\n' '474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87' "$RUNNER_TEMP/neovim.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          REQUIRE_NATIVE_NEOVIM: '1'
        run: pnpm run validate

  manual-appearance:
    name: Validate manual website wallpaper assets
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Validate appearance frames and source fingerprints
        run: node scripts/build-appearance-wallpapers.mjs --check

  deploy:
    needs: [manual-validation, manual-appearance]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.manual-validation.result == 'success' && needs.manual-appearance.result == 'success'))
    name: Deploy theme.santi020k.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: websites-production
      url: https://theme.santi020k.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Verify current website inputs
        run: |
          git fetch --no-tags --depth=1 origin main
          node .github/scripts/website-inputs.mjs "$GITHUB_SHA" FETCH_HEAD

      - name: Validate Cloudflare deployment config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$PROJECT_NAME" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_THEME_HUB repository variable"; exit 1; }

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22
          cache-dependency-path: pnpm-lock.yaml

      - name: Build consolidated website
        run: pnpm run site:build

      - name: Validate website SEO and links
        run: pnpm run validate:seo && pnpm run validate:links

      - name: Deploy consolidated website to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          git fetch --no-tags --depth=1 origin main
          node .github/scripts/website-inputs.mjs "$GITHUB_SHA" FETCH_HEAD
          pnpm exec wrangler pages deploy apps/website/dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_THEME_HUB }}" --branch=main

      - name: Preserve legacy domain redirects
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for project in \
            santi020k-vscode-theme \
            santi020k-chrome-theme \
            santi020k-terminal-theme \
            santi020k-zed-theme \
            santi020k-codex-theme
          do
            pnpm exec wrangler pages deploy "cloudflare/legacy-pages/$project" --project-name="$project" --branch=main
          done
