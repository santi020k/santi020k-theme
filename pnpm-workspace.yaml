packages:
  - packages/*
  - apps/*
allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false
  keytar: false
  sharp: false
  unrs-resolver: false
  workerd: false
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
catalog:
  "@astrojs/check": ^0.9.9
  "@astrojs/ts-plugin": ^1.10.10
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@santi020k/commitprompt": ^1.0.0
  "@santi020k/eslint-config-astro": ^3.1.4
  "@santi020k/eslint-config-basic": ^3.4.0
  "@santi020k/eslint-config-extensions": ^3.1.3
  "@santi020k/eslint-config-formats": ^3.1.3
  "@santi020k/eslint-config-libraries": ^3.1.3
  "@santi020k/eslint-config-testing": ^3.1.3
  "@santi020k/eslint-config-tools": ^3.1.3
  "@santi020k/lumen-astro": 1.4.0
  "@santi020k/og": 1.1.1
  "@types/node": ^26.2.0
  "@vscode/vsce": ^3.9.2
  archiver: ^8.0.0
  astro: ^7.3.4
  cspell: ^10.0.1
  eslint: ^10.7.0
  knip: ^6.29.0
  lint-staged: ^17.2.0
  ovsx: ^1.0.2
  oxlint: ^1.85.0
  sharp: ^0.35.4
  smol-toml: ^1.7.1
  turbo: ^2.10.7
  typescript: ^5.9.3
  vite: ^8.1.5
  vitest: ^4.1.11
  wrangler: ^4.114.0
ignoredBuiltDependencies:
  - "@vscode/vsce-sign"
  - esbuild
  - keytar
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@santi020k/og"
  - "@santi020k/lumen-astro@1.4.0"
  - "@santi020k/lumen-core@1.4.0"
  - "@santi020k/lumen@1.4.0"
  - "@santi020k/eslint-config-typescript"
  - astro@7.3.4
  - js-yaml@4.3.2
  - qs@6.16.0
  - sharp@0.35.4
  - svgo@4.1.0

overrides:
  "@manypkg/get-packages>read-yaml-file": 2.1.0
  '@vitest/mocker@>=2.1.0 <4.1.11': '>=4.1.11'
  astro@<7.2.8: '>=7.2.8'
  astro@<=7.2.3: '>=7.2.4'
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  "brace-expansion@5": ^5.0.9
  devalue@<5.9.1: '>=5.9.2'
  fast-uri: ^4.1.3
  fast-uri@>=4.0.0 <4.1.3: '>=4.1.3'
  fast-uri@>=4.0.1 <4.1.3: '>=4.1.3'
  js-yaml: ^4.3.2
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2'
  linkify-it: ^5.0.2
  nanoid: ^3.3.18
  postcss: ^8.5.23
  qs@>=2.2.5 <6.16.0: '>=6.16.0'
  qs@>=6.14.2 <=6.15.3: '>=6.16.0'
  sharp@<0.35.4: '>=0.35.4'
  smol-toml@<=1.7.0: '>=1.7.1'
  svgo: ^4.1.0
  svgo@>=4.0.0 <4.1.0: '>=4.1.0'
  undici: ^8.9.0
  valibot: ^1.4.2
  vite: ^8.1.5
  vitest@>=2.1.0 <4.1.11: '>=4.1.11'

peerDependencyRules:
  allowedVersions:
    eslint: "10"
